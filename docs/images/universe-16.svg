<text x="32" y="79" font-size="30" fill="#163c55">van Emde Boas / universe 16</text>
<text x="32" y="108" font-size="14" fill="#526575">5 keys  |  21 allocated nodes  |  1120 owned bytes  |  21 cards shown</text>
<text x="32" y="138" font-size="13" fill="#92602d">Successor(7) = 9  |  orange: accessed nodes (including extrema reads)</text>
<text x="32" y="161" font-size="11" fill="#526575">Summary domains are independent of root keys. Collapsed branches may contain highlighted accesses.</text>
