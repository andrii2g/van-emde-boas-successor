<svg xmlns="http://www.w3.org/2000/svg" width="3852" height="718" viewBox="0 0 3852 718" role="img" aria-labelledby="title description">
<title id="title">van Emde Boas tree, universe 16</title>
<desc id="description">Recursive cluster hierarchy. Summary nodes store cluster indices. Highlighted nodes show query accesses; collapsed nodes may hide accesses.</desc>
