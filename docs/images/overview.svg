<svg xmlns="http://www.w3.org/2000/svg" width="1312" height="540" viewBox="0 0 1312 540" role="img" aria-labelledby="title description">
<title id="title">van Emde Boas tree, universe 16</title>
<desc id="description">Recursive cluster hierarchy. Summary nodes store cluster indices. Highlighted nodes show query accesses; collapsed nodes may hide accesses.</desc>
<rect width="100%" height="100%" fill="#fbfcfe"/>
<g font-family="Segoe UI,Arial,sans-serif">
<text x="32" y="40" font-size="12" fill="#426782">INTEGER SETS / RECURSIVE DECOMPOSITION</text>
<text x="32" y="79" font-size="30" fill="#163c55">van Emde Boas / universe 16</text>
<text x="32" y="108" font-size="14" fill="#526575">5 keys  |  21 allocated nodes  |  1120 owned bytes  |  6 cards shown</text>
<text x="32" y="138" font-size="13" fill="#92602d">Successor(7) = 9  |  orange: accessed nodes (including extrema reads)</text>
<text x="32" y="161" font-size="11" fill="#526575">Summary domains are independent of root keys. Collapsed branches may contain highlighted accesses.</text>
<path d="M656,314 C656,342 148,342 148,370" fill="none" stroke="#db7d23" stroke-width="2" stroke-dasharray="6 5"/>
<path d="M656,314 C656,342 402,342 402,370" fill="none" stroke="#79a49b" stroke-width="2"/>
<path d="M656,314 C656,342 656,342 656,370" fill="none" stroke="#db7d23" stroke-width="2"/>
<path d="M656,314 C656,342 910,342 910,370" fill="none" stroke="#db7d23" stroke-width="2"/>
<path d="M656,314 C656,342 1164,342 1164,370" fill="none" stroke="#79a49b" stroke-width="2"/>
<g id="r"><title>ROOT: local universe 16, min Some(2), max Some(14)</title><rect x="540" y="192" width="232" height="122" rx="10" fill="#eaf3fb" stroke="#db7d23" stroke-width="3"/>
<text x="554" y="215" font-size="12" fill="#31546a">ROOT  /  U=16</text>
<text x="554" y="236" font-size="11" fill="#526575">root keys [0..16)</text>
<text x="554" y="258" font-size="13" fill="#19364a">local min 2   max 14</text>
<text x="554" y="277" font-size="11" fill="#526575">root min 2   max 14</text>
<text x="554" y="295" font-size="10" fill="#526575">minimum stored outside clusters</text>
</g>
<g id="r-s"><title>SUMMARY: local universe 4, min Some(0), max Some(3)</title><rect x="32" y="370" width="232" height="122" rx="10" fill="#f5efff" stroke="#db7d23" stroke-width="3"/>
<text x="46" y="393" font-size="12" fill="#31546a">SUMMARY  /  U=4</text>
<text x="46" y="414" font-size="11" fill="#526575">summary IDs [0..4)</text>
<text x="46" y="436" font-size="13" fill="#19364a">local min 0   max 3</text>
<text x="46" y="455" font-size="11" fill="#526575">summary keys are cluster indices</text>
<text x="46" y="473" font-size="10" fill="#526575">3/3 branches collapsed</text>
</g>
<g id="r-c0"><title>CLUSTER 0: local universe 4, min Some(3), max Some(3)</title><rect x="286" y="370" width="232" height="122" rx="10" fill="#eff8f4" stroke="#8db9a8" stroke-width="1"/>
<text x="300" y="393" font-size="12" fill="#31546a">CLUSTER 0  /  U=4</text>
<text x="300" y="414" font-size="11" fill="#526575">root keys [0..4)</text>
<text x="300" y="436" font-size="13" fill="#19364a">local min 3   max 3</text>
<text x="300" y="455" font-size="11" fill="#526575">root min 3   max 3</text>
<text x="300" y="473" font-size="10" fill="#526575">3 empty branches hidden</text>
</g>
<g id="r-c1"><title>CLUSTER 1: local universe 4, min Some(3), max Some(3)</title><rect x="540" y="370" width="232" height="122" rx="10" fill="#eff8f4" stroke="#db7d23" stroke-width="3"/>
<text x="554" y="393" font-size="12" fill="#31546a">CLUSTER 1  /  U=4</text>
<text x="554" y="414" font-size="11" fill="#526575">root keys [4..8)</text>
<text x="554" y="436" font-size="13" fill="#19364a">local min 3   max 3</text>
<text x="554" y="455" font-size="11" fill="#526575">root min 7   max 7</text>
<text x="554" y="473" font-size="10" fill="#526575">3 empty branches hidden</text>
</g>
<g id="r-c2"><title>CLUSTER 2: local universe 4, min Some(1), max Some(1)</title><rect x="794" y="370" width="232" height="122" rx="10" fill="#eff8f4" stroke="#db7d23" stroke-width="3"/>
<text x="808" y="393" font-size="12" fill="#31546a">CLUSTER 2  /  U=4</text>
<text x="808" y="414" font-size="11" fill="#526575">root keys [8..12)</text>
<text x="808" y="436" font-size="13" fill="#19364a">local min 1   max 1</text>
<text x="808" y="455" font-size="11" fill="#526575">root min 9   max 9</text>
<text x="808" y="473" font-size="10" fill="#526575">3 empty branches hidden</text>
</g>
<g id="r-c3"><title>CLUSTER 3: local universe 4, min Some(2), max Some(2)</title><rect x="1048" y="370" width="232" height="122" rx="10" fill="#eff8f4" stroke="#8db9a8" stroke-width="1"/>
<text x="1062" y="393" font-size="12" fill="#31546a">CLUSTER 3  /  U=4</text>
<text x="1062" y="414" font-size="11" fill="#526575">root keys [12..16)</text>
<text x="1062" y="436" font-size="13" fill="#19364a">local min 2   max 2</text>
<text x="1062" y="455" font-size="11" fill="#526575">root min 14   max 14</text>
<text x="1062" y="473" font-size="10" fill="#526575">3 empty branches hidden</text>
</g>
</g>
</svg>
