<text x="32" y="40" font-size="12" fill="#426782">INTEGER SETS / RECURSIVE DECOMPOSITION</text>
<text x="32" y="79" font-size="30" fill="#163c55">van Emde Boas / universe 65536</text>
<text x="32" y="108" font-size="14" fill="#526575">9 keys  |  92007 allocated nodes  |  4416448 owned bytes  |  16 cards shown</text>
<text x="32" y="138" font-size="13" fill="#92602d">Successor(257) = 4095  |  orange: accessed nodes (including extrema reads)</text>
<text x="32" y="161" font-size="11" fill="#526575">Summary domains are independent of root keys. Collapsed branches may contain highlighted accesses.</text>
